services:
  - type: web
    name: nblm-backend
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: XKIRO_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_R2_ACCESS_KEY
        sync: false
      - key: CF_R2_SECRET_KEY
        sync: false
